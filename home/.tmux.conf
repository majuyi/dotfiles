# Set the default terminal type. This was set twice (xterm- then screen-),
# so only the second ever applied. tmux-256color is the value tmux itself
# recommends and, unlike screen-256color, its terminfo advertises italics
# (sitm) — which is what makes moonflyItalics actually render in nvim.
# If you ssh somewhere without a tmux-256color terminfo entry, fall back to
# screen-256color there.
set -g default-terminal "tmux-256color"

# Enable true color support for better color rendering
set -as terminal-overrides ",*-256color:Tc"

# Let OSC 8 hyperlinks through to the outer terminal.
# tmux has supported hyperlinks since 3.4, but it only forwards them when the
# OUTER terminal's terminfo advertises the Hls capability. Kitty's does not, so
# `tmux info` reported "Hls: [missing]" and tmux was silently dropping the URL
# target — leaving styled blue text with nothing behind it, while plain-text
# URLs still worked because Kitty detects those itself.
# The xterm-kitty: prefix scopes this by the outer TERM, so it is inert on
# machines where the outer terminal is something else.
set -as terminal-features ",xterm-kitty:hyperlinks"

# Unbind the default prefix (Ctrl-b) and set a new prefix (`) for faster access
unbind C-b
set -g prefix `

# Quick window switching
bind-key ` last-window           # ` + ` switches to the last window

# Name every window after its directory, and after what is running in it when
# that is worth saying.
#
# automatic-rename tracked the foreground process alone, which gave six windows
# called "zsh" and three called "2.1.272" / "2.1.270" / "2.1.273" — Claude Code
# renames its own process to its version string, so that is what tmux saw. The
# directory alone was no better: three windows called Sandbox with no way to
# tell the editor from the agent.
#
# So: basename, then a suffix only when the pane is running something other
# than the shell. Claude Code is the command whose name starts with a digit
# (nothing else here does), and it gets called what it is rather than what
# version it is at.
#
#   dami   clist   devspot   paybook·nvim   astutorials-v1
#   553    Sandbox·claude    Sandbox        Sandbox·claude   552
#
# A name set by hand (` + ,) still wins and sticks, which is how to tell two
# windows apart when the directory and the command are both the same.
set -g automatic-rename-format '#{b:pane_current_path}#{?#{m:[0-9]*,#{pane_current_command}},·claude,#{?#{==:#{pane_current_command},zsh},,·#{pane_current_command}}}'

# Close window 4 of 0-9 and the gap used to stay open, so the numbers drifted
# away from the ` + <n> keys.
set -g renumber-windows on

# Escape key for the prefix (backtick)
bind-key e send-prefix           # ` + e sends the prefix (useful for nested tmux sessions or just typing the backtick)

# Create new windows and panes in the current directory
bind-key c new-window -c "#{pane_current_path}"			# Create new window
bind-key v split-window -h -c "#{pane_current_path}"	# Split window horizontally
bind-key s split-window -v -c "#{pane_current_path}"	# Split window vertically

# Claude Code in a popup, floating over whatever window is in front.
#
# A popup is not a window: it borrows the screen, then gives it back, so the
# agent stops competing for a slot in the window list. Escape or ` + d
# dismisses it.
#
# ` + a is the one to use. It attaches to a session named for the current
# directory (new-session -A creates it only if it is missing), so dismissing
# the popup leaves the conversation running and the next ` + a in that
# directory lands back in it. tmux rewrites "." to "_" when it creates a
# session but not when it looks one up, so majuyi.com would create
# claude-majuyi_com and then never find it again — #{s/[.]/-/:...} spells the
# dot out as a dash first and keeps both halves agreeing.
#
# ` + A is the throwaway: no session, no history, gone when it exits.
bind-key a display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
	"tmux new-session -A -s claude-#{s/[.]/-/:#{b:pane_current_path}} -c '#{pane_current_path}' claude"
bind-key A display-popup -E -w 90% -h 90% -d "#{pane_current_path}" claude


# Vim-style navigation between panes using h, j, k, l
bind 'h' select-pane -L # Move left
bind 'j' select-pane -D # Move down
bind 'k' select-pane -U # Move up
bind 'l' select-pane -R # Move right

# Increase scrollback buffer to 500,000 lines
set-option -g history-limit 500000

# Enable Option/Alt + Arrow word jumps
bind-key -n M-Left  send-keys M-b   # Move one word left
bind-key -n M-Right send-keys M-f   # Move one word right

# Enable vi-style keybindings in copy mode
setw -g mode-keys vi

# Enable mouse interactions (resizing panes, scrolling, selecting windows)
set -g mouse on

# Pass terminal focus in/out to the running program. Neovim's :checkhealth
# asks for this by name: without it 'autoread' can't notice a file that
# changed on disk outside the editor.
set -g focus-events on

# Clipboard.
# This block used to pipe every selection through `xsel`, which is an X11 tool
# that does not exist on macOS — so none of it ever worked. tmux-yank (already
# in the plugin list below) does the same job via pbcopy, so it just needs
# telling to target the system clipboard on mouse selection.
set -g @yank_selection_mouse 'clipboard'
set -g set-clipboard on          # let applications set the clipboard via OSC 52

# y in copy-mode copies to the system clipboard (tmux-yank binds this);
# double- and triple-click select word/line, which tmux does by default.

# tpm: Initialize tmux plugin manager (TPM)
set -g @plugin 'tmux-plugins/tpm'

# tmux-yank: Clipboard plugin for easier yanking to system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-themepack: Theme pack plugin for better visual aesthetics
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/default/gray' # Use powerline-style gray theme

# tmux-resurrect: Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'vim ssh mysql redis node python3' # Processes to save and restore

# tmux-continuum: Automatic saving of tmux environment
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'          # Don't auto-restore last session on startup
set -g @continuum-save-interval '15'     # Save every 15 minutes

# tpm: Load tmux plugin manager (TPM) on startup
run '~/.tmux/plugins/tpm/tpm'

