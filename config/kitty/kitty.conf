# Font and appearance
#
# This was plain "SF Mono", whose cmap has 1259 glyphs and none of the icon
# ranges — so tmux's powerline/default/gray separators and every nvim-tree /
# web-devicons / lualine icon fell back to boxes. Liga SFMono Nerd Font is the
# same typeface patched to 10472 glyphs, covering powerline (U+E0A0/E0B0) and
# the Nerd Font sets.
font_family			Liga SFMono Nerd Font
bold_font			auto
italic_font			auto
bold_italic_font	auto

font_size			12.5

# The font ships ligatures; this keeps != and -> as separate characters, so
# only the icons changed and code reads exactly as it did before.
disable_ligatures	always

map alt+left  send_text all \x1b[1;3D
# Alt + Left Arrow
map alt+right send_text all \x1b[1;3C
# Alt + Right Arrow

# Colors
#background                #1e1e2e
#foreground                #cdd6f4
#selection_background      #6c7086

# Window title format
#window_title_format "{title} - kitty"

# Enable clipboard integration
#enable_clipboard_control yes

# Scrolling
#scrollback_lines 5000

# Mouse support
#map ctrl+shift+c copy_to_clipboard
#map ctrl+shift+v paste_from_clipboard
