# Font and appearance
#
# Text is Apple's original, unpatched SF Mono — the crispest of the three
# SF Mono variants installed here, and untouched by any patcher.
font_family			SF Mono
bold_font			auto
italic_font			auto
bold_italic_font	auto

font_size			12.5

disable_ligatures	always

# SF Mono has 1259 glyphs and none of the icon ranges, so tmux's
# powerline/default/gray separators and every nvim-tree / web-devicons /
# lualine icon used to fall back to boxes. Rather than replace the whole
# typeface with a patched one, map *only* the icon codepoints to the Nerd
# Font. Every letter you read stays Apple's original outline; the Nerd Font
# is consulted only for glyphs SF Mono cannot draw at all.
#
# powerline separators (what tmux-themepack draws with)
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0D7 Liga SFMono Nerd Font
# seti + custom, devicons, codicons
symbol_map U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E Liga SFMono Nerd Font
# font awesome, font logos, octicons
# (U+ED00-U+EFCE deliberately omitted: this Nerd Font build has 0% coverage
#  there, so mapping it would point at a font that cannot draw it)
symbol_map U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533 Liga SFMono Nerd Font
# material design icons (nvim-web-devicons uses these heavily)
symbol_map U+F0001-U+F1AF0 Liga SFMono Nerd Font
# IEC power symbols, weather
symbol_map U+23FB-U+23FE,U+2B58,U+E300-U+E3E3 Liga SFMono Nerd Font

map alt+left  send_text all \x1b[1;3D
# Alt + Left Arrow
map alt+right send_text all \x1b[1;3C
# Alt + Right Arrow

# Colors
#
# Solarized Osaka (dark), generated by craftzdog/solarized-osaka.nvim and
# vendored beside this file so the terminal, tmux and nvim all read from one
# palette. Kept as a separate include rather than pasted inline so it can be
# replaced wholesale when upstream regenerates it.
include solarized-osaka-dark.conf

# Window title format
#window_title_format "{title} - kitty"

# Enable clipboard integration
#enable_clipboard_control yes

# Scrolling
#scrollback_lines 5000

# Mouse support
#map ctrl+shift+c copy_to_clipboard
#map ctrl+shift+v paste_from_clipboard
