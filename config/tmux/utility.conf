# vim: ft=tmux
# Popups: things that borrow the screen and hand it straight back, rather than
# taking a slot in the window list.

# Claude Code sessions: craftzdog/tmux-claude-hatch (plugin list in tmux.conf).
#
# This replaced a hand-rolled ` + a / ` + A popup pair. Chosen over the
# alternatives after checking each against this machine, not their READMEs:
#
#   claude-squad, ccmanager  host their own sessions around git worktrees, so
#                            neither sees a Claude started in a pane, and
#                            Sandbox is not a git repo at all.
#   claude-tmux              one row per tmux SESSION — everything here lives
#                            in session 0 — and finds Claude by a pane command
#                            of `claude`, which never matches: Claude Code
#                            renames its process to its version (2.1.273).
#   claude agents (native)   the data is right but the dashboard is built for
#                            sessions it dispatched; it listed two of four
#                            pane-started sessions, and spawns a daemon plus
#                            two warm spares just to open.
#
# hatch reads `claude agents --json` directly and joins pid -> tty -> pane, so
# every Claude shows up — several in one directory, several in one session —
# with the status Claude itself reports, and selecting one jumps back to the
# window it was launched from.
#
# Launch is on ` + i rather than hatch's default y: tmux-yank already owns
# prefix + y (copy the current command line). It was ` + a until 6 Nov, but
# backtick and a are both left pinky. i sits beside the picker's u (hatch's
# own default, kept), on the other hand, and only replaces tmux's stock
# display-message, which the status bar already shows. This must be set
# before tpm runs, since hatch reads it at load.
set -g @claude_launch_key 'i'

# Every new hatch starts as /color yellow (was a bare /color, which picked a
# random colour; changed 6 Nov). Recolour a session by hand with /color <name>.
# hatch only passes this when it creates a session, not when it reopens one.
# The inner quotes matter: tmux runs this through sh, which would otherwise
# split it into /color + purple, and claude would drop purple and pick a random colour.
set -g @claude_args "'/color purple'"

# Vim-style picker, from hatch's README (added 6 Nov; Dami was already
# reaching for j/k by reflex). Opens in nav mode: j/k move, x kills, q closes,
# enter jumps. / switches to filter mode (type to fuzzy-match); esc goes
# back to nav. ctrl-x still kills in either mode.
# Backspace on an empty query also goes back to nav (fzf's backward-eof), so a
# stray / can be undone without reaching the pinky up to esc. With text
# in the query, backspace just deletes as normal; it only fires once empty.
set -g @claude_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$CLAUDE_PICKER --list)' \
  --bind '/:unbind(j,k,q,/,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,/,x)+change-prompt(nav> )' \
  --bind 'backward-eof:rebind(j,k,q,/,x)+change-prompt(nav> )'"
