# vim: ft=tmux
# Colours and borders. The palette itself is the generated file this sources;
# everything here is either what that file does not cover, or has to be set
# before it runs.

# Pane borders. The colours come from the Osaka file sourced at the bottom
# (#063540 idle, #268bd3 active); this is the line weight. "heavy" draws the
# box-drawing heavies (━ ┃ ╋) instead of the default lights, which is what
# makes a split read as a division rather than a hairline. Needs tmux 3.2+.
set -g pane-border-lines heavy

# Solarized Osaka (dark), generated by craftzdog/solarized-osaka.nvim and
# vendored into this repo — the same palette kitty and nvim now read, so the
# three stop disagreeing at their edges.
#
# This replaced tmux-themepack's powerline/default/gray, which is no longer
# installed — so unlike before, this no longer has to be sourced after tpm.
# It sets no status-interval, so tmux's own default of 15s applies and the
# once-a-second repaint the themepack caused stays gone.
#
# %H:%M rather than 12-hour: the file checks clock-mode-style, so this has to
# be set before it is sourced.
set -g clock-mode-style 24
source-file ~/.config/tmux/solarized-osaka-dark.tmux

# Pane numbers (` + q) and the clock (` + t). themepack used to colour these,
# and dropping it left them on tmux's defaults — red/blue pane numbers and a
# blue clock, the only two surfaces still shipping stock colours. craftzdog
# sets the same three in his theme.conf; these are the Osaka equivalents,
# matched to the pane borders so the active one reads the same either way.
set -g display-panes-active-colour "#268bd3"
set -g display-panes-colour "#576d74"
setw -g clock-mode-colour "#268bd3"
