# vim: ft=tmux
# Undercurl, and coloured underlines, taken from craftzdog's macos.conf.
# nvim's LSP draws diagnostics as undercurls; without these tmux flattens them
# to a plain underline in one colour, so the squiggle under an error and the
# one under a hint become indistinguishable. Setulc needs tmux 3.0+.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
