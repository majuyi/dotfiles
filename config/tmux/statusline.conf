# vim: ft=tmux
# The extras file above is a whole status bar, not just a palette — sourcing it
# replaced the themepack layout as well as its colours. What it left was flat
# blocks with no powerline separators, a date you had deliberately trimmed
# away, left-justified windows instead of centred, and an empty gap where
# #{prefix_highlight} expands to nothing because tmux-prefix-highlight is not
# installed here.
#
# So: keep its colours, put the themepack/powerline/default/gray layout back on
# top, in Osaka's palette rather than greys. Blocks are unchanged from that
# theme — session / whoami / window:pane on the left, clock / date / host on
# the right, current window darker than the bar — with one edit: themepack
# split session and window:pane into two blocks either side of the username.
# #S:#I.#P is craftzdog's single segment, which says session, window and pane
# in one place instead of making you read across the bar to assemble it.
#
# The active window is two filled blocks, not one: index in amber on cream,
# then name in cream on amber, solid caps either side. That is craftzdog's
# window-status-current-format with Solarized's #eee8d5/#b58900 swapped for
# Osaka's #ede7d3/#b28500, which are the same two colours to within a shade.
# A single dark block on a dark bar is why the active window used to be
# indistinguishable from its neighbours.
#
# #F is dropped from the active format only: the colour already says which
# window you are in, so the `*` was restating it. Inactive windows keep it,
# because there `!` (bell) and `#` (activity) are the only way to know.
#
# One substitution: themepack's #(whoami) is #{user}, a built-in that reads
# the same name without forking a shell on every status refresh.
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 150
setw -g window-status-separator ""

set -g status-left "#[fg=#001419,bg=#268bd3,bold] #S:#I.#P #[fg=#268bd3,bg=#576d74,nobold]#[fg=#001419,bg=#576d74] #{user} #[fg=#576d74,bg=#002c38,nobold]"
set -g status-right "#[fg=#063540,bg=#002c38]#[fg=#839395,bg=#063540] %H:%M #[fg=#576d74,bg=#063540]#[fg=#001419,bg=#576d74] %d-%b-%y #[fg=#268bd3,bg=#576d74]#[fg=#001419,bg=#268bd3,bold] #H "
setw -g window-status-format '#[fg=#002c38,bg=#002c38]#[default] #I #[fg=#576d74]#[default] #W#F #[fg=#002c38,bg=#002c38,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#002c38,bg=#ede7d3]#[fg=#b28500,bg=#ede7d3,bold] #I #[fg=#ede7d3,bg=#b28500,nobold]#[fg=#ede7d3,bg=#b28500] #W #[fg=#b28500,bg=#002c38,nobold]'
setw -g window-status-current-style "NONE"
