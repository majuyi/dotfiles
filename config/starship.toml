# Osaka-coloured powerline prompt, shaped after craftzdog's:
#
#    ~/A/W/553/Sandbox  ⑂ main !2                       1m 22s / 03:20:14
#
# Same palette as ~/.config/kitty/solarized-osaka-dark.conf and the tmux
# status bar, so the prompt, the bar and the editor stop disagreeing.
#
# add_newline is false on purpose: .zshrc already prints the blank line
# between commands via NEWLINE_BEFORE_PROMPT, and starship's own would double
# it.
add_newline = false

format = """\
$directory\
[](fg:#268bd3 bg:#576d74)\
$git_branch\
$git_status\
[](fg:#576d74)\
$character"""

right_format = "$cmd_duration$time"

[directory]
style = "fg:#001419 bg:#268bd3 bold"
format = "[ $path ]($style)"
# Four components, parents shortened to two letters each — what turns
# ~/Atelier/Workspace/553/Sandbox into ~/At/Wo/553/Sandbox rather than
# eating half the line.
truncation_length = 4
truncation_symbol = "…/"
fish_style_pwd_dir_length = 2

[git_branch]
symbol = "⑂ "
style = "fg:#001419 bg:#576d74"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:#001419 bg:#576d74"
format = "[$all_status$ahead_behind ]($style)"
# Starship's defaults are bare symbols: "!" whether one file changed or forty.
# ${count} is what produces the "!2" / "!5" in his shot, which is the only part
# of a dirty-state indicator that tells you anything.
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[ ❯](fg:#268bd3)"
error_symbol = "[ ❯](fg:#db302d)"

# The two right-hand segments in his shot: how long the last command took,
# and when it finished. min_time keeps it quiet for anything under a second.
[cmd_duration]
min_time = 1000
style = "fg:#576d74"
format = "[$duration]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:#576d74"
format = "[ / $time]($style)"
